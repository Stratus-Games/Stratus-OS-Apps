<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta
        name="viewport"
        content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"
    />
    <title>The Binding of Isaac: Wrath of the Lamb</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            z-index: 9999;
        }

        #progress {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.85;
        }

        /* Sidebar ad styles (unchanged) */
        #sidebarad1,
        #sidebarad2 {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 600px;
            padding: 0;
            margin: 0;
            z-index: 999999;
        }

        #sidebarad1 {
            left: 0;
        }

        #sidebarad2 {
            right: 0;
        }

        .sidebar-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .sidebar-frame {
            width: 160px;
            height: 600px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <script src="./R/ruffle.js"></script>

    <div id="loading">
        <div>Loading game...</div>
        <div id="progress">0%</div>
    </div>

    <div id="player"></div>

    <script>
        async function fetchPart(url, label) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Failed to load ${label}: ${response.status}`);
            }

            return await response.arrayBuffer();
        }

        function updateProgress(percent) {
            document.getElementById("progress").textContent =
                Math.floor(percent) + "%";
        }

        async function loadGame() {
            try {
                // Fetch both parts
                const [part1, part2] = await Promise.all([
                    fetchPart("./tboiwotl-v1.666.swf.part1", "part1"),
                    fetchPart("./tboiwotl-v1.666.swf.part2", "part2")
                ]);

                updateProgress(50);

                // Merge the two parts into one Uint8Array
                const merged = new Uint8Array(
                    part1.byteLength + part2.byteLength
                );

                merged.set(new Uint8Array(part1), 0);
                merged.set(new Uint8Array(part2), part1.byteLength);

                updateProgress(90);

                // Create Blob URL for the reconstructed SWF
                const swfBlob = new Blob([merged], {
                    type: "application/x-shockwave-flash"
                });

                const swfUrl = URL.createObjectURL(swfBlob);

                updateProgress(100);

                // Hide loading screen
                document.getElementById("loading").style.display = "none";

                // Create Ruffle player
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();

                player.style.width = "100%";
                player.style.height = "100%";

                document.getElementById("player").appendChild(player);

                // Load reconstructed SWF
                player.load({
                    url: swfUrl
                });
            } catch (error) {
                console.error(error);
                document.getElementById("loading").innerHTML =
                    "<div>Failed to load game.</div><div id='progress'>" +
                    error.message +
                    "</div>";
            }
        }

        loadGame();
    </script>
</body>
</html>
