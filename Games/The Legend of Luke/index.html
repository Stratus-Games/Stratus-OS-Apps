<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | My project (2)</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }

    #unity-loading-bar,
    #unity-warning,
    #unity-footer {
      position: absolute;
      z-index: 10;
    }

    #unity-loading-bar {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #unity-footer {
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div></div>
  </div>

  <script>
  var canvas = document.querySelector("#unity-canvas");

  async function mergeWasmParts(parts) {
    // Fetch all parts
    const responses = await Promise.all(
      parts.map(url => fetch(url).then(r => r.arrayBuffer()))
    );

    // Calculate total size
    let totalLength = responses.reduce((sum, part) => sum + part.byteLength, 0);

    // Merge into one Uint8Array
    let merged = new Uint8Array(totalLength);

    let offset = 0;
    for (const part of responses) {
      merged.set(new Uint8Array(part), offset);
      offset += part.byteLength;
    }

    return merged;
  }

  function unityShowBanner(msg, type) {
    var warningBanner = document.querySelector("#unity-warning");

    function updateBannerVisibility() {
      warningBanner.style.display =
        warningBanner.children.length ? 'block' : 'none';
    }

    var div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);

    if (type == 'error')
      div.style = 'background:red;padding:10px;';
    else {
      if (type == 'warning')
        div.style = 'background:yellow;padding:10px;';

      setTimeout(() => {
        warningBanner.removeChild(div);
        updateBannerVisibility();
      }, 5000);
    }

    updateBannerVisibility();
  }

  async function startUnity() {

    const buildUrl = "Build";

    // Merge wasm parts
    const wasmBytes = await mergeWasmParts([
      buildUrl + "/new.wasm.part1",
      buildUrl + "/new.wasm.part2",
      buildUrl + "/new.wasm.part3"
    ]);

    // Create blob URL for Unity
    const wasmBlob = new Blob([wasmBytes], {
      type: "application/wasm"
    });

    const wasmBlobUrl = URL.createObjectURL(wasmBlob);

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/new.data",
      frameworkUrl: buildUrl + "/new.framework.js",

      // Use merged wasm blob
      codeUrl: wasmBlobUrl,

      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project (2)",
      productVersion: "5.1.1",
      showBanner: unityShowBanner
    };

    document.querySelector("#unity-loading-bar").style.display = "block";

    const loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/new.loader.js";

    loaderScript.onload = () => {

      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";

      }).then((unityInstance) => {

        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((err) => {
        console.error(err);
        alert(err);
      });
    };

    document.body.appendChild(loaderScript);
  }

  startUnity();
</script>
</body>
</html>
